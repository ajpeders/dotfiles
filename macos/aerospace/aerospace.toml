# Aerospace config — modeled after Hyprland keybinds
# https://nikitabobko.github.io/AeroSpace/guide

# Start on login
start-at-login = true

# macOS restores every app's windows at login in a burst, racing AeroSpace's
# startup, which is why things look shuffled after a reboot. This re-tiles the
# workspace once AeroSpace is up. Pair it with disabling macOS window restore:
#   defaults write com.apple.loginwindow TALLogoutSavesState -bool false
after-startup-command = ['layout tiles --root']

# Normalizations.
# flatten-containers is OFF on purpose. With it on, every window in a workspace
# becomes an equal sibling, so five windows means five narrow columns. Hyprland's
# dwindle instead splits only the focused window, giving a binary spiral where
# tiles stay far wider. Off + opposite-orientation below is the closest AeroSpace
# gets to dwindle.
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = true

# Closest thing AeroSpace has to Hyprland's dwindle. 'auto' picks the split
# orientation from the monitor's aspect ratio (horizontal on wide, vertical on
# tall) instead of always splitting the same way, which is what makes new
# windows land somewhere sensible. Pinning the layout to 'tiles' also stops a
# workspace coming up in accordion, where windows stack instead of tiling.
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus.
# Monitor-level warping only. Per-window warping (on-focus-changed) is disabled
# deliberately: it fights macOS focus tracking and causes focus ping-pong/stutter.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Gaps (similar to Hyprland gaps)
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.right = 8
outer.top = 8
outer.bottom = 8

# ====== Window rules ======
[[on-window-detected]]
if.app-id = 'org.mozilla.librewolf'
run = ['layout tiling']

# System Settings is a Mac Catalyst app: non-standard Accessibility tree (its
# window reports an empty title) and a rigid minimum size it will not resize
# below. Forcing it into the tiling tree just reserves a tile it refuses to
# fill, which reads as a broken/overlapping window. Float it instead.
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['layout floating']

# Tailscale ships with LSUIElement=1, so AeroSpace floats it by default. But it
# switches activation policy to regular at runtime and its main window is a real
# AXStandardWindow, so force it into the tiling tree.
[[on-window-detected]]
if.app-id = 'io.tailscale.ipn.macsys'
run = ['layout tiling']

# ====== Apps ======
# alt = Option key (used as Super equivalent on macOS)

[mode.main.binding]
# Terminal
# -d ~ is required: AeroSpace is launched by launchd, whose working directory is
# /, and exec-and-forget inherits it. Without this, every new terminal opens in /.
alt-enter = 'exec-and-forget /opt/homebrew/bin/kitty --single-instance=no -d ~'
alt-t = 'exec-and-forget /opt/homebrew/bin/kitty --single-instance=no -d ~'

# Browser
# MOZ_DISABLE_SAFE_MODE_KEY=1 stops LibreWolf from interpreting the held Option
# key (from alt-e) as the Troubleshoot Mode trigger.
alt-e = 'exec-and-forget env MOZ_DISABLE_SAFE_MODE_KEY=1 /Applications/LibreWolf.app/Contents/MacOS/librewolf --new-window about:blank'

# btop
alt-b = 'exec-and-forget /opt/homebrew/bin/kitty --single-instance=no btop'

# Close window
alt-q = 'close'

# Fullscreen
alt-f = 'fullscreen'

# Float / tiling toggle
alt-shift-f = 'layout floating tiling'

# Toggle split direction (Hyprland's SUPER+J togglesplit)
alt-j = 'layout tiles horizontal vertical'

# Force the whole workspace back to tiles. Recovery for a workspace that ends up
# in accordion, where windows stack on top of each other and nothing looks
# tiled — alt-j only retargets the focused node, so it cannot undo that.
alt-shift-j = 'layout tiles --root'

# ====== Focus ======
alt-left = 'focus left'
alt-right = 'focus right'
alt-up = 'focus up'
alt-down = 'focus down'

# ====== Move Windows ======
alt-shift-left = 'move left'
alt-shift-right = 'move right'
alt-shift-up = 'move up'
alt-shift-down = 'move down'

# ====== Resize Windows ======
alt-ctrl-left = 'resize width -50'
alt-ctrl-right = 'resize width +50'
alt-ctrl-up = 'resize height -50'
alt-ctrl-down = 'resize height +50'

# ====== Workspaces ======
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

# Move window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'

# Monitor focus (like Super+Tab)
alt-tab = 'focus-monitor next'

# Move workspace to monitor
alt-shift-tab = 'move-workspace-to-monitor next'

# Balance window sizes
alt-shift-b = 'balance-sizes'

# Reload config
alt-shift-r = 'reload-config'
