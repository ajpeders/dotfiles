# Theme colors: Noctalia's "kitty" template renders themes/noctalia.conf
# (gitignored). kitty logs a missing include and carries on, so a fresh
# machine starts fine before Noctalia has rendered it once.
# Personal overrides below beat it.
include themes/noctalia.conf

# ---------- URLs ----------
open_url_with default

# ---------- Font ----------
font_family JetBrainsMono Nerd Font
bold_italic_font auto
# 12.0 is the long-standing personal setting from the 27" desktop; on the
# Air's 2560x1600 13" panel 9-10 fits noticeably more rows.
font_size 12.0
disable_ligatures never

# ---------- Window ----------
background_opacity 0.85
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

# ---------- Cursor ----------
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

# ---------- Scrolling ----------
scrollback_lines 5000
wheel_scroll_multiplier 5.0

# ---------- Bell ----------
enable_audio_bell no

# ---------- Keybindings ----------
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# ---------- Tab bar ----------
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
