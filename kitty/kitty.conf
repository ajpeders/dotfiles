# Theme colors, one include per desktop stack. kitty logs a missing include
# and carries on, so these need no per-host edits:
#   Noctalia's "kitty" template renders themes/noctalia.conf (gitignored).
#   Omarchy's comes second so `omarchy theme set ...` wins where both exist.
# Personal overrides below beat both.
include themes/noctalia.conf
include ~/.local/state/omarchy/current/theme/kitty.conf

# ---------- URLs ----------
open_url_with default

# ---------- Font ----------
font_family JetBrainsMono Nerd Font
bold_italic_font auto
# Omarchy's default is 9.0. 12.0 is the long-standing personal setting, carried
# from the 27" desktop; on this 2560x1600 13" panel 9-10 fits noticeably more
# rows, so try lowering it if the terminal feels cramped.
font_size 12.0
disable_ligatures never

# ---------- Window ----------
background_opacity 0.85
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

# ---------- Cursor ----------
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

# ---------- Scrolling ----------
scrollback_lines 5000
wheel_scroll_multiplier 5.0

# ---------- Bell ----------
enable_audio_bell no

# ---------- Keybindings ----------
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# ---------- Omarchy integration ----------
# Required by omarchy-restart-terminal and the Omarchy agent scratchpad.
allow_remote_control yes
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}

# ---------- Tab bar ----------
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
