# Quickshell renders themes/quickshell.conf on startup and theme changes.
# A fresh install may lack this generated file until Quickshell starts.

# ---------- URLs ----------
open_url_with default

# ---------- Font ----------
font_family Tamzen
bold_font family=Tamzen style=Bold
bold_italic_font auto
# Tamzen looks smaller than the previous JetBrainsMono at the same point size.
font_size 14.0
disable_ligatures never

# ---------- Window ----------
remember_window_size no
# Keep the wallpaper visible behind the terminal.
background_opacity 0.85
dynamic_background_opacity yes
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0
# Only local sockets may control kitty (not terminal escape sequences).
# Each instance gets its own socket so Quickshell can update all of them.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-quickshell-{kitty_pid}

# ---------- Cursor ----------
cursor_shape block
cursor_blink_interval 0
# no-rc: the automatic rc injection cannot work with a hand-set ZDOTDIR;
# zsh/.zshrc loads the integration itself instead.
shell_integration no-cursor no-rc
# Correct low-contrast text (including apps' true-color/pastel foregrounds)
# against the cell background without losing its hue.
text_fg_override_threshold 4.5 ratio

# ---------- Scrolling ----------
scrollback_lines 5000
wheel_scroll_multiplier 5.0

# ---------- Bell ----------
enable_audio_bell no

# ---------- Keybindings ----------
map ctrl+insert copy_to_clipboard
# SUPER+C (hypr/config/keybinds.lua) forwards CTRL+C to the focused window.
# copy_or_interrupt copies when there is a selection and sends SIGINT otherwise,
# so the mac-style copy works here without breaking ^C.
map ctrl+c copy_or_interrupt
# Matching paste for SUPER+V. This shadows readline/zsh quoted-insert (^V);
# use ctrl+shift+v or shift+insert if you need the literal-next-char behaviour.
map ctrl+v paste_from_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# ---------- Tab bar ----------
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
include themes/quickshell.conf
