# Session-wide defaults for opencode's {env:...} placeholders in
# opencode/opencode.json. zsh/.zshrc sets the same fallbacks, but only for
# shells that source it — a Hyprland keybind or app launcher does not, and an
# unset LLM_SERVER_URL leaves baseURL empty, which fails at request time
# rather than at startup.
#
# systemd reads *.conf here in name order, so a machine that needs a different
# server can drop a higher-numbered file (90-llm-local.conf, gitignored)
# without touching this one.
LLM_SERVER_URL=http://localhost:11434/v1
LLM_MODEL=qwen3-coder:30b
