# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃            Idle / Power Management — ON BATTERY              ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
# Aggressive timeouts for when running on battery (roughly half the AC delays).
# The AC variant (hypridle-ac.conf) is more relaxed.
# scripts/hypridle-power.sh picks between them and swaps live on plug/unplug.
# hypridle has no include mechanism, so the general{} block is duplicated in
# both files — keep them in sync.
# Docs: https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/

general {
    # loginctl lock-session (and the idle lock listener below) triggers this.
    lock_cmd = pidof noctalia > /dev/null && noctalia msg session lock
    # Lock before any suspend (lid close or idle-suspend) so it wakes locked.
    before_sleep_cmd = noctalia msg session lock
    # Turn the display back on after waking.
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 1 min - dim the screen (brightnessctl -s saves the level so -r restores it).
listener {
    timeout = 60
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 1 min - and kill the keyboard backlight.
listener {
    timeout = 60
    on-timeout = brightnessctl -sd kbd_backlight set 0
    on-resume  = brightnessctl -rd kbd_backlight
}

# 2 min - lock the screen (runs lock_cmd above).
listener {
    timeout = 120
    on-timeout = loginctl lock-session
}

# 2.5 min - turn the display off (DPMS).
listener {
    timeout = 150
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 5 min - suspend (before_sleep_cmd locks first).
listener {
    timeout = 300
    on-timeout = systemctl suspend
}
