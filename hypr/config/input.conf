# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                      Input Configuration                    ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Input wiki https://wiki.hyprland.org/Configuring/Variables/\#input

input {
    kb_layout = us
    follow_mouse = 1 # 0|1|2|3
    sensitivity = 0
    float_switch_override_focus = 2

    touchpad {
        natural_scroll = true        # macOS-style scroll direction
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true  # 1/2/3 fingers = left/right/middle click (Apple trackpad has no button areas)
        scroll_factor = 0.5
    }
}

# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Touchpad Gestures                        ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
# Hyprland 0.51+ syntax: gesture = <fingers>, <direction>, <action>
# https://wiki.hyprland.org/Configuring/Gestures/

gesture = 3, horizontal, workspace       # 3-finger swipe L/R: change workspace
gesture = 4, up, special, magic          # 4-finger swipe up: toggle magic scratchpad

# Shorter swipe travel to complete a workspace switch (default 300)
gestures {
    workspace_swipe_distance = 150
}
