#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Noctalia runs as a systemd user service so SUPER+SHIFT+R can restart it.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP; systemctl --user start noctalia-shell.service
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# Idle management (dim -> lock -> screen off -> suspend). Battery-aware launcher
# swaps between hypr/hypridle-ac.conf and hypr/hypridle-battery.conf on plug/unplug.
exec-once = ~/.config/hypr/scripts/hypridle-power.sh
