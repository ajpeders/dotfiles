# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                         Keybinds                            ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

$ipc = qs -c noctalia-shell ipc call

# ====== Apps ======
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, E, exec, $browser
bind = $mainMod SHIFT, B, exec, $terminal btop
bind = $mainMod, Space, exec, $ipc launcher toggle
bind = $mainMod, V, exec, $ipc launcher clipboard
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, M, fullscreen, 0
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, togglefloating,

# ====== Noctalia ======
bind = $mainMod, N, exec, $ipc notifications toggleHistory
bind = $mainMod, comma, exec, $ipc settings toggle
bind = $mainMod, A, exec, $ipc controlCenter toggle
bind = $mainMod, L, exec, $ipc lockScreen lock
bind = $mainMod, O, exec, $ipc sessionMenu toggle
# Restart the shell (recovery after a crash, e.g. Bluetooth disconnect segfault)
bind = $mainMod SHIFT, R, exec, systemctl --user restart noctalia-shell.service
# Keep-awake / caffeine: toggle the idle inhibitor (blocks hypridle dim/lock/suspend).
# SHIFT+A toggles indefinitely; CTRL+A keeps awake for 1 hour then auto-releases.
bind = $mainMod SHIFT, A, exec, $ipc idleInhibitor toggle
bind = $mainMod CTRL, A, exec, $ipc idleInhibitor enableFor 3600

# ====== Screenshots ======
bind = $mainMod, P, exec, grim ~/Pictures/Screenshots/$(date +'%Y-%m-%d-%H%M%S_screenshot.png')
bind = $mainMod SHIFT, P, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +'%Y-%m-%d-%H%M%S_screenshot.png')
bind = $mainMod CTRL, P, exec, grim -g "$(slurp)" - | wl-copy


# ====== Misc ======

# ====== Monitor Focus (for gaming) ======
bind = $mainMod, Tab, focusmonitor, +1

# ====== Focus ======
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ====== Move Windows ======
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# ====== Resize Windows ======
bind = $mainMod CTRL, left, resizeactive, -50 0
bind = $mainMod CTRL, right, resizeactive, 50 0
bind = $mainMod CTRL, up, resizeactive, 0 -50
bind = $mainMod CTRL, down, resizeactive, 0 50

# ====== Workspaces ======
bind = $mainMod, 1, focusworkspaceoncurrentmonitor, 1
bind = $mainMod, 2, focusworkspaceoncurrentmonitor, 2
bind = $mainMod, 3, focusworkspaceoncurrentmonitor, 3
bind = $mainMod, 4, focusworkspaceoncurrentmonitor, 4
bind = $mainMod, 5, focusworkspaceoncurrentmonitor, 5
bind = $mainMod, 6, focusworkspaceoncurrentmonitor, 6
bind = $mainMod, 7, focusworkspaceoncurrentmonitor, 7
bind = $mainMod, 8, focusworkspaceoncurrentmonitor, 8
bind = $mainMod, 9, focusworkspaceoncurrentmonitor, 9
bind = $mainMod, 0, focusworkspaceoncurrentmonitor, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, equal, togglespecialworkspace, magic
bind = $mainMod, minus, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ====== Media Keys ======
bindel = ,XF86AudioRaiseVolume, exec, $ipc volume increase
bindel = ,XF86AudioLowerVolume, exec, $ipc volume decrease
bindl = ,XF86AudioMute, exec, $ipc volume muteOutput
bindl = ,XF86AudioMicMute, exec, $ipc volume muteInput
bindel = ,XF86MonBrightnessUp, exec, $ipc brightness increase
bindel = ,XF86MonBrightnessDown, exec, $ipc brightness decrease
# Keyboard backlight keys (Mac F5/F6) — the dedicated keys, so no submap needed
bindel = ,XF86KbdBrightnessUp, exec, brightnessctl --device=kbd_backlight set 10%+
bindel = ,XF86KbdBrightnessDown, exec, brightnessctl --device=kbd_backlight set 10%-
bindl = , XF86AudioNext, exec, $ipc media next
bindl = , XF86AudioPause, exec, $ipc media playPause
bindl = , XF86AudioPlay, exec, $ipc media playPause
bindl = , XF86AudioPrev, exec, $ipc media previous

# ====== Brightness submap (SUPER + B) ======
# Up/Down or +/- = screen brightness; Left/Right = keyboard backlight; Esc/Enter exits.
bind = $mainMod, B, submap, brightness
submap = brightness
# Screen
binde = , up,    exec, $ipc brightness increase
binde = , down,  exec, $ipc brightness decrease
binde = , equal, exec, $ipc brightness increase
binde = , minus, exec, $ipc brightness decrease
# Keyboard backlight
binde = , right, exec, brightnessctl --device=kbd_backlight set 10%+
binde = , left,  exec, brightnessctl --device=kbd_backlight set 10%-
# Exit (Esc/Enter, or press B / SUPER+B again to toggle off)
bind = , escape, submap, reset
bind = , Return, submap, reset
bind = , b, submap, reset
bind = $mainMod, b, submap, reset
submap = reset

# ====== Keyboard backlight (SUPER + K) ======
# Each press rotates the backlight 0 -> 100% -> 0% in 20% steps.
bind = $mainMod, K, exec, ~/.config/hypr/scripts/kbd-backlight-cycle.sh
