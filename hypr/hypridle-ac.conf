# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃            Idle / Power Management — ON AC POWER             ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
# Relaxed timeouts for when the charger is plugged in.
# The battery variant (hypridle-battery.conf) is more aggressive.
# scripts/hypridle-power.sh picks between them and swaps live on plug/unplug.
# hypridle has no include mechanism, so the general{} block is duplicated in
# both files — keep them in sync.
# Docs: https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/

general {
    # loginctl lock-session (and the idle lock listener below) triggers this.
    lock_cmd = pidof qs > /dev/null && qs -c noctalia-shell ipc call lockScreen lock
    # Lock before any suspend (lid close or idle-suspend) so it wakes locked.
    before_sleep_cmd = qs -c noctalia-shell ipc call lockScreen lock
    # Turn the display back on after waking.
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 2.5 min - dim the screen (brightnessctl -s saves the level so -r restores it).
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 2.5 min - and kill the keyboard backlight.
listener {
    timeout = 150
    on-timeout = brightnessctl -sd kbd_backlight set 0
    on-resume  = brightnessctl -rd kbd_backlight
}

# 5 min - lock the screen (runs lock_cmd above).
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min - turn the display off (DPMS).
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 15 min - suspend (before_sleep_cmd locks first).
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
