# own. The tile shows the active resolver and opens the switcher panel.
id = "alex/home-tiles"
name = "Home Tiles"
version = "0.1.0"
author = "alex"
license = "MIT"
description = "Control-center tile for dns-switcher."
dependencies = ["networkmanager"]
tags = ["shortcut"]
