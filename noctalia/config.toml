# Noctalia v5 config. Hand-written layer; GUI overrides land in
# ~/.local/state/noctalia/settings.toml and win over this file.
# Reference: https://docs.noctalia.dev/noctalia/  (defaults: example.toml in the repo)

[shell]
font_family   = "Sans Serif"
time_format   = "{:%-I:%M:%S %p}"  # 12-hour everywhere in the shell UI
polkit_agent  = false               # polkit-gnome is started from hypr/config/autostart.lua
clipboard_enabled = true            # replaces cliphist + wl-paste watchers

[shell.panel]
launcher_placement = "floating"
launcher_position  = "center"       # SUPER+Space opens mid-screen
control_center_placement = "attached"   # near-click only works when attached
open_near_click_control_center = true  # bar click opens under the widget (far right)

[theme]
mode             = "dark"
source           = "wallpaper"       # palette follows the current wallpaper
wallpaper_scheme = "m3-tonal-spot"   # Material You default; m3-content stays closer to the image

[theme.templates]
enable_builtin_templates = true
# hyprland -> ~/.config/hypr/noctalia.lua (border colours), required from hyprland.lua
# kitty    -> ~/.config/kitty/themes/noctalia.conf, included from kitty.conf
# gtk3/4   -> ~/.config/gtk-{3,4}.0/noctalia.css, @imported from gtk.css
# btop     -> btop theme
builtin_ids = ["btop", "gtk3", "gtk4", "hyprland", "kitty"]

[wallpaper]
enabled             = true
fill_mode           = "crop"
directory           = "~/Pictures/Wallpapers"
transition          = ["fade", "disc", "stripes", "wipe", "zoom", "honeycomb"]
transition_duration = 1500

[weather]
enabled = true
unit    = "celsius"

[location]
address = "Denver"

[nightlight]
enabled = false

[lockscreen]
enabled = true

# Idle is owned by hypridle (hypr/hypridle-{ac,battery}.conf); it calls
# `noctalia msg session lock`, so Noctalia's own idle timers stay off.
[idle.behavior.lock]
enabled = false
[idle.behavior.screen-off]
enabled = false

# Community plugins, fetched from github.com/noctalia-dev/community-plugins on
# first start. GUI enables/disables land in settings.toml's [plugins] and win.
# alex/* live in ./plugins/: home-tiles (control-center DNS tile); tailscale and
# ai-usagebar (davemhammer/tailscale, felipeartur/ai-usagebar vendored and
# restyled to match the built-in bar widgets).
[plugins]
enabled = ["nightwatch75/dns-switcher", "alex/ai-usagebar", "alex/home-tiles", "alex/tailscale"]

# Source list as the GUI writes it (built-ins included), plus the local one.
[[plugins.source]]
name     = "official"
kind     = "git"
location = "https://github.com/noctalia-dev/official-plugins"

[[plugins.source]]
name     = "community"
kind     = "git"
location = "https://github.com/noctalia-dev/community-plugins"

[[plugins.source]]
name     = "local"
kind     = "path"
location = "~/.config/noctalia/plugins"

[bar.main]
position           = "top"
thickness          = 36
background_opacity = 0.93
radius             = 0
margin_ends        = 0              # flush to both screen edges; no end gaps
margin_edge        = 0
padding            = 10
widget_spacing     = 6
start  = ["workspaces", "audio-vis", "media"]
center = ["clock"]
end    = ["group:tray", "volume", "sysmon", "brightness", "battery", "tailscale", "ai-usage", "notifications", "control-center"]

# Tray collapses to a chevron; hovering it unfolds the icons to the LEFT
# (accordion group, reveal direction "start"). Right-click an icon > Pin is
# for the drawer mode only, which this replaces.
[widget.tray]
drawer = false

[widget.tray-handle]
type    = "custom_button"
glyph   = "chevron-left"
tooltip = "Tray"

[[bar.main.capsule_group]]
id                  = "tray"
members             = ["tray-handle", "tray"]
accordion           = true
accordion_direction = "start"
padding             = 4
opacity             = 0.0           # no capsule background; reads as plain bar widgets

[widget.media]
max_length   = 360                  # default 220
title_scroll = "always"             # marquee long titles

[widget.audio-vis]
type    = "audio_visualizer"
width   = 240
bands   = 40
color_1 = "primary"
color_2 = "secondary"

# Community port of the v4 DNS Switcher (needs dig/nslookup from `bind`).
# Left-click: provider panel; right-click: back to ISP default; scroll: cycle.
[plugin_settings."nightwatch75/dns-switcher"]
custom_1 = "isis = 100.106.42.30"   # home server's resolver over Tailscale

[widget.dns]
type       = "nightwatch75/dns-switcher:dns-switcher"
show_label = false                  # icon only; left-click panel shows the active provider

# Tailscale: online/total peers on the bar; click for connect/exit-node/peer
# panel, `/ts` in the launcher. up/down/set need `tailscale set --operator=$USER`.
[widget.tailscale]
type        = "alex/tailscale:status"
show_counts = true

[plugin_settings."alex/tailscale"]
ssh_user = "alex"

# AI plan usage (Claude, OpenAI, Copilot, OpenCode Go, ...) via the
# `ai-usagebar` CLI; providers/credentials live in ~/.config/ai-usagebar/.
# Left-click: panel; right-click: refresh. "auto" shows the busiest provider.
[widget.ai-usage]
type           = "alex/ai-usagebar:bar"
vendor         = "auto"
visualization  = "none"            # no gauge bars
extras         = "none"            # no reset countdown; hover/panel still show it
provider_limit = 1

[widget.clock]
format = "{:%a %b %-d}  {:%-I:%M:%S %p}"

[control_center]
sidebar = "full"
sidebar_section = "full"
hidden_tabs = []

# Home grid fits six tiles; session lives in the header's power button.
# alex/home-tiles:dns comes from noctalia/plugins/home-tiles; click opens the switcher panel.
[[control_center.shortcuts]]
type = "alex/home-tiles:dns"

[[control_center.shortcuts]]
type = "audio"

[[control_center.shortcuts]]
type = "mic_mute"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "system"
