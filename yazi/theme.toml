# Yazi theme. Static colors, originally rendered from the Omarchy palette;
# Noctalia has no yazi template, so edit these by hand.

[mgr]
cwd = { fg = "#dc441f" }
find_keyword = { fg = "#8adc00", bold = true, italic = true, underline = true }
find_position = { fg = "#b8c4ff", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#ffdad2", bg = "#ffdad2" }
marker_cut = { fg = "#1e100c", bg = "#1e100c" }
marker_marked = { fg = "#dc441f", bg = "#dc441f" }
marker_selected = { fg = "#8adc00", bg = "#8adc00" }
count_copied = { fg = "#1e100c", bg = "#ffdad2" }
count_cut = { fg = "#1e100c", bg = "#1e100c" }
count_selected = { fg = "#1e100c", bg = "#8adc00" }
border_symbol = "|"
border_style = { fg = "#a48b86" }

[tabs]
active = { fg = "#1e100c", bg = "#ffb951", bold = true }
inactive = { fg = "#ffb951", bg = "#f9dcd6" }

[mode]
normal_main = { fg = "#1e100c", bg = "#ffb951", bold = true }
normal_alt = { fg = "#ffb951", bg = "#f9dcd6" }
select_main = { fg = "#1e100c", bg = "#dc441f", bold = true }
select_alt = { fg = "#dc441f", bg = "#f9dcd6" }
unset_main = { fg = "#1e100c", bg = "#8adc00", bold = true }
unset_alt = { fg = "#8adc00", bg = "#f9dcd6" }

[status]
perm_sep = { fg = "#a48b86" }
perm_type = { fg = "#ffb951" }
perm_read = { fg = "#8adc00" }
perm_write = { fg = "#1e100c" }
perm_exec = { fg = "#ffdad2" }
progress_label = { fg = "#ffdad2", bold = true }
progress_normal = { fg = "#ffdad2", bg = "#f9dcd6" }
progress_error = { fg = "#8adc00", bg = "#1e100c" }

[pick]
border = { fg = "#ffb951" }
active = { fg = "#b8c4ff", bold = true }
inactive = {}

[input]
border = { fg = "#ffb951" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#ffb951" }

[tasks]
border = { fg = "#ffb951" }
title = {}
hovered = { fg = "#b8c4ff", bold = true }

[which]
mask = { bg = "#f9dcd6" }
cand = { fg = "#dc441f" }
rest = { fg = "#a48b86" }
desc = { fg = "#b8c4ff" }
separator = " > "
separator_style = { fg = "#a48b86" }

[help]
on = { fg = "#dc441f" }
run = { fg = "#b8c4ff" }
hovered = { reversed = true, bold = true }
footer = { fg = "#f9dcd6", bg = "#ffdad2" }

[spot]
border = { fg = "#ffb951" }
title = { fg = "#ffb951" }
tbl_col = { fg = "#dc441f" }
tbl_cell = { fg = "#b8c4ff", bg = "#f9dcd6" }

[notify]
title_info = { fg = "#ffdad2" }
title_warn = { fg = "#8adc00" }
title_error = { fg = "#1e100c" }

[filetype]
rules = [
  { mime = "image/*", fg = "#dc441f" },
  { mime = "{audio,video}/*", fg = "#8adc00" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#b8c4ff" },
  { mime = "application/{pdf,doc,rtf}", fg = "#ffdad2" },
  { mime = "vfs/{absent,stale}", fg = "#a48b86" },
  { url = "*", fg = "#ffdad2" },
  { url = "*/", fg = "#ffb951" },
]
