# foot — the terminal Omarchy actually launches. `omarchy terminal` (SUPER+RETURN)
# runs xdg-terminal-exec, whose only preference is foot.desktop, so this file is
# what you get on an Omarchy box even though kitty/kitty.conf is the shared
# config. Settings below track kitty.conf; the deltas from Omarchy's stock foot
# config are marked.
#
# NOTE: foot aborts on a missing `include=` — unlike kitty, which skips one.
# If Omarchy ever comes off this machine, delete the include line below or foot
# will not start at all.

[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
# kitty.conf: font_size 12.0. Omarchy's stock foot is 9; 12.0 is the personal
# setting carried from the 27" desktop. On this 2560x1600 13" panel 9-10 fits
# noticeably more rows, so drop it here if the terminal feels cramped.
#
# Two Omarchy helpers sed this line in place, so expect git churn from them:
# `omarchy-display-text-size` rewrites :size= to the chosen point size (it
# reads the current size from kitty.conf first, so the two stay in step), and
# `omarchy-font-set` hard-resets the whole line to :size=9 regardless.
font=JetBrainsMono Nerd Font:size=12
# kitty.conf: window_padding_width 14
pad=14x14
initial-window-mode=windowed
# Render on the main thread rather than a pool sized to the CPU count. Cheaper
# on a laptop, and foot is fast enough without them.
workers=0

# kitty.conf: background_opacity 0.85. foot 1.28 split [colors] into
# colors-dark/colors-light, and Omarchy's themes only write colors-dark, so set
# alpha in both to survive a light theme. After the include, so it wins.
[colors-dark]
alpha=0.85

[colors-light]
alpha=0.85

[csd]
# kitty.conf: hide_window_decorations yes
preferred=none

[scrollback]
# kitty.conf: scrollback_lines 5000 / wheel_scroll_multiplier 5.0
# (Omarchy's stock foot is 10000 / 7.0.)
lines=5000
multiplier=5.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
